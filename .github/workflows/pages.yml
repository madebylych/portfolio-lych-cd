# Publica el portafolio en GitHub Pages cada vez que se sube algo a master.
# Compila con Vite (base /portfolio-lych-cd/) y copia index.html como 404.html
# para que los enlaces directos a /proyecto/... funcionen (GitHub Pages no
# tiene reescrituras: sirve 404.html y el router de la app lee la ruta).
name: Publicar en GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: despliegue
        uses: actions/deploy-pages@v4
